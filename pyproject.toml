[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_tfhp"
version = "0.1.0"
description = "Mittag-Leffler Tempered Fractional Hawkes Process for Financial Modeling"
authors = [{ name = "Research Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "numba>=0.56.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
